# Static example, not a deployment receipt. State + owner file pre-provisioned uid1000.
services:
  opencontext:
    image: ${OPENCONTEXT_IMAGE:?use a reviewed local digest/image}
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      NODE_ENV: production
      OPENCONTEXT_BIND_HOST: 0.0.0.0
      OPENCONTEXT_PUBLIC_ORIGIN: ${OPENCONTEXT_PUBLIC_ORIGIN:?reviewed HTTPS reverse proxy origin required}
      OPENCONTEXT_DATA_ROOT: /var/lib/opencontext
      OPENCONTEXT_OWNER_TOKEN_FILE: /run/opencontext-owner
      OPENCONTEXT_SHUTDOWN_TIMEOUT_MS: '15000'
    volumes:
      - ${OPENCONTEXT_DATA_PATH:?private absolute state directory}:/var/lib/opencontext
      - ${OPENCONTEXT_OWNER_FILE:?private absolute owner file}:/run/opencontext-owner:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    restart: 'no'
